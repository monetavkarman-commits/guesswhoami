# Daily backup of the Supabase data (accounts, nicknames, leaderboard, reports, 30 days of events) as a private workflow artifact kept for 30 days.
# One-time setup: repository → Settings → Secrets and variables → Actions → New repository secret: SUPABASE_ACCESS_TOKEN (a token from supabase.com/dashboard/account/tokens).
# The repository is public, so the copy is NOT committed to it: artifacts are visible only to people with access to the repository settings.
name: Backup
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dump the data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: uspdbqzfrvfhgpeuguje
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set (see the comment at the top of this file)"; exit 1; fi
          curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"select public.backup_data() as data"}' -o raw.json
          python3 - <<'PY'
          import json
          d = json.load(open('raw.json'))[0]['data']
          json.dump(d, open('backup.json', 'w'), ensure_ascii=False)
          print({k: (len(v) if isinstance(v, list) else 1) for k, v in d.items()})
          PY
          rm raw.json
      - uses: actions/upload-artifact@v4
        with:
          name: guesswhoami-backup-${{ github.run_id }}
          path: backup.json
          retention-days: 30
