# Every 4 hours: re-download the esports player data from Liquipedia (CS and Dota 2), rebuild the datasets and, only if the raw data changed, publish.
# Follows the Liquipedia API terms: descriptive User-Agent with contact, gzip, batched requests, ~1 request per 2.5 s (see scripts/fetch-liquipedia.mjs).
name: Refresh player data
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from Liquipedia
        env:
          LIQUIPEDIA_UA: 'GuessWhoAmI/1.0 (https://guesswhoami.eu; https://github.com/monetavkarman-commits/guesswhoami/issues)'
        run: |
          node scripts/fetch-liquipedia.mjs cs
          node scripts/fetch-liquipedia.mjs dota
      - name: Rebuild and publish if anything changed
        run: |
          if git diff --quiet -- data/raw; then echo "No changes in the source data."; exit 0; fi
          node scripts/build-dataset.mjs
          node scripts/validate-data.mjs   # a broken refresh stops here and is never published
          git config user.name "data-refresh[bot]"
          git config user.email "data-refresh@users.noreply.github.com"
          git add data/raw public/data
          git commit -m "Refresh player data from Liquipedia ($(date -u +%F\ %H:%M) UTC)"
          git push
          gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
